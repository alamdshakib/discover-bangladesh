<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('discover-bd-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored ? stored === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0B111E');
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Discover Bangladesh — An editorial visual showcase and travel guide celebrating the hills, coastlines, forests, and living heritage of Bengal."
    />
    <title>Discover Bangladesh — Explore the Beauty of Bengal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://thumb.wikimedia.org" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas text-ink dark:text-slate-50 antialiased transition-colors duration-300 selection:bg-ink selection:text-white dark:selection:bg-white dark:selection:text-[#0B111E]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
